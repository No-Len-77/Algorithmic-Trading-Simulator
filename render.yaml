# =============================================================================
# Render Blueprint — one-click public deploy.
#
# Provisions three resources in one region:
#   • hft-postgres — managed PostgreSQL 18   (free plan, expires after 30d)
#   • hft-redis    — managed Key Value/Redis (free plan, internal-only)
#   • algorithmic-trading-simulator — web service (Docker): SPA + API + WebSocket
#                    same-origin via Dockerfile.web.
#
# Deploy:  Render Dashboard → New → Blueprint → pick this repo.
# Spec:    https://render.com/docs/blueprint-spec
# =============================================================================

databases:
  # NOTE: this name must match the instance that already exists in the Render
  # dashboard. It read `hft-db` while the live instance was `hft-postgres`, so
  # each blueprint sync tried to create a *second* free Postgres — which Render
  # refuses (one free instance per workspace) — and the web service kept its
  # stale DATABASE_URL instead of being rewired.
  #
  # Free Postgres instances EXPIRE 30 days after creation and are then
  # "Suspended by Render". A suspended instance cannot be resumed: delete it
  # and re-sync this blueprint, which recreates the database and rewires
  # DATABASE_URL below automatically. See DEPLOY.md §
  # "Recovering from a suspended database".
  - name: hft-postgres
    plan: free
    databaseName: hft
    user: hft
    region: oregon
    postgresMajorVersion: "18"

services:
  # ---- Managed Redis (Key Value) ----
  - type: keyvalue
    name: hft-redis
    plan: free
    region: oregon
    ipAllowList: []            # internal connections only (no public access)
    maxmemoryPolicy: allkeys-lru

  # ---- Web service: SPA + API + WebSocket (single same-origin process) ----
  - type: web
    name: algorithmic-trading-simulator
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Strong 256-bit secret generated by Render (satisfies the prod guard).
      - key: JWT_SECRET_KEY
        generateValue: true
      # Postgres connection string (coerced postgres:// -> postgresql:// in app).
      - key: DATABASE_URL
        fromDatabase:
          name: hft-postgres
          property: connectionString
      # Redis connection string from the Key Value instance above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hft-redis
          property: connectionString
      # Same-origin deploy → allow the Render host (TrustedHostMiddleware).
      - key: ALLOWED_HOSTS
        value: '["*.onrender.com", "localhost", "127.0.0.1"]'
      # Deterministic 24/7 synthetic market: zero external data dependencies.
      - key: USE_SYNTHETIC_MARKET
        value: "true"
      - key: USE_FAKE_REDIS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
